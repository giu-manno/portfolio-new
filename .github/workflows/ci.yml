name: CI build check

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint is not enforced yet — the codebase has pre-existing eslint
      # errors (case-study pages, lightbox). Add a lint step once clean.
      - name: Build
        run: npm run build
        env:
          PAGES_BASE_PATH: /portfolio-new
